name: FA baza checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Compile Python files
        run: python -m compileall -q fa_base tests
      - name: Run regression tests
        env:
          BOT_TOKEN: ''
          ADMIN_IDS: ''
        run: python -m unittest discover -s tests -v
